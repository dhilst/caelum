<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Caelum — LTL model checker in WebAssembly</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 15rem; font-family: ui-monospace, monospace; font-size: 13px; }
  .row { display: flex; gap: .75rem; align-items: center; margin: .75rem 0; flex-wrap: wrap; }
  pre { background: rgba(127,127,127,.12); padding: 1rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  button { padding: .4rem .9rem; font-size: 14px; }
  .muted { opacity: .7; font-size: 13px; }
</style>
</head>
<body>
  <h1>Caelum — LTL model checker in WebAssembly</h1>
  <p class="muted">
    The parser + checker are Rust compiled to wasm. With the <strong>z3.js</strong>
    engine, each property is encoded to SMT-LIB2 and solved by Z3 (also compiled
    to wasm) in a second module — no solver is linked into the Caelum module.
  </p>

  <textarea id="spec">let x: 0..2
init { x = 0 }
transition step { x' = (x + 1) mod 3 }
property never_two { [] (x != 2) }
property reaches_two { &lt;&gt; (x = 2) }
</textarea>

  <div class="row">
    <label>engine:
      <select id="engine">
        <option value="explicit">explicit (varisat, in-module)</option>
        <option value="bmc-varisat">BMC · varisat (in-module)</option>
        <option value="bmc-z3" selected>BMC · z3.js (external Z3 wasm)</option>
      </select>
    </label>
    <label>bmc-depth: <input id="depth" type="number" value="20" min="1" style="width:5rem"></label>
    <button id="run">Check</button>
    <span id="status" class="muted"></span>
  </div>

  <pre id="out">Ready.</pre>

  <script type="module">
    import init, { check_spec, check_spec_z3 } from '../pkg/caelum_wasm.js';
    import { makeSolve } from './z3glue.js';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status'), out = $('out');

    await init(); // instantiate the caelum wasm module

    $('run').onclick = async () => {
      const spec = $('spec').value;
      const engine = $('engine').value;
      const depth = parseInt($('depth').value, 10) || 20;
      out.textContent = '';
      statusEl.textContent = 'checking…';
      try {
        let json;
        if (engine === 'bmc-z3') {
          statusEl.textContent = 'loading z3.js…';
          const solve = await makeSolve();
          statusEl.textContent = 'solving with z3…';
          json = await check_spec_z3(spec, JSON.stringify({ bmc_depth: depth }), solve);
        } else if (engine === 'bmc-varisat') {
          json = check_spec(spec, JSON.stringify({ engine: 'bmc', bmc_depth: depth }));
        } else {
          json = check_spec(spec, JSON.stringify({ engine: 'explicit' }));
        }
        out.textContent = JSON.stringify(JSON.parse(json), null, 2);
        statusEl.textContent = 'done';
      } catch (e) {
        out.textContent = 'error: ' + e;
        statusEl.textContent = 'error';
      }
    };
  </script>
</body>
</html>
