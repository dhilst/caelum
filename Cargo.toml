[package]
name = "tplgine"
version = "0.1.0"
edition = "2021"
description = "Temporal propositional logic engine and model checker"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
