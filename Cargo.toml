[package]
name = "caelum"
version = "0.1.0"
edition = "2021"
description = "LTL model checker"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
pest = "2"
pest_derive = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
varisat = { version = "0.2", optional = true }
cadical = { version = "0.1", optional = true }
z3 = { version = "0.20", optional = true }

[features]
default = ["bmc-varisat", "bmc-z3"]
bmc-varisat = ["dep:varisat"]
bmc-cadical = ["dep:cadical"]
bmc-z3 = ["dep:z3"]

[dev-dependencies]
tempfile = "3"
