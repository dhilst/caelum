[workspace]
resolver = "2"
members = ["caelum-kernel", "caelum-cli", "caelum-wasm", "ci"]
# caelum-wasm is built explicitly for wasm targets (wasm-pack / --target
# wasm32-unknown-unknown), so keep it out of the default native build/test set.
default-members = ["caelum-kernel", "caelum-cli", "ci"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pest = "2"
pest_derive = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
